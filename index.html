<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>事件小本本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小本本">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：标题 → 吸顶的一条黑板（搜索 + 记录/话术切换）→ 卡片或话术。
   「记一笔」整页切过去（不弹层、不原地展开），「存」在顶栏；返回也会存。
   短选项一律一排横着滑。只有一层吸顶。 */
:root {
  --paper: #f2f5fa;
  --card: #ffffff;
  --ink: #1f2d44;
  --ink2: #5d6b82;
  --line: #dce3ee;
  --board: #5585c7;
  --board2: #3f69a8;
  --chalk: #ffffff;
  --chalk2: #e3edfa;
  --pink: #dc5d88;
  --on-pink: #ffffff;
  --pink-soft: #fde6ee;
  --pink-ink: #c4507a;
  --reg-ink: #a8365f;
  --yellow: #805a0b;
  --yellow-soft: #f8edcf;
  --warn: #a3401c;
  --on-warn: #ffffff;
  --warn-soft: #fae0d5;
  --good: #dc5d88;
  --good-soft: #fde6ee;
  --ring: #c3ccda; --on-good: #ffffff;
  --c1: #2d5fa6; --c1-soft: #dde9fb;
  --c2: #6847a8; --c2-soft: #ebe3f8;
  --c3: #1f6f69; --c3-soft: #d6efec;
  --leaf1: #eef3fb; --leaf2: #fbeff4;
  --glass: rgba(246, 214, 224, .58); --glass-ink: #7d4258; --glass-line: rgba(255, 255, 255, .65); --glass-hi: rgba(255, 255, 255, .7); --glass-shadow: rgba(140, 80, 100, .18); --glass-btn: #b9718a; --glass-btn-ink: #ffffff;
  --shadow: 0 1px 2px rgba(31, 45, 68, .06), 0 6px 18px rgba(31, 45, 68, .07);
  --font-display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --r: 18px;
  --scrim: rgba(31, 45, 68, .3); --fab-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121821; --card: #1b2330; --ink: #e6ecf5; --ink2: #9aa8bd; --line: #2b3646;
    --board: #2a4470; --board2: #1e3356; --chalk: #f2f6fc; --chalk2: #b9cbe6;
    --pink: #f08aa6; --on-pink: #2a0f18; --pink-soft: #3a2430; --pink-ink: #f4a3b9; --reg-ink: #f4a3b9;
    --yellow: #e5bb5c; --yellow-soft: #352d1c; --warn: #f19a6c; --on-warn: #2b130a; --warn-soft: #3b271e;
    --good: #f08aa6; --good-soft: #3a2430;
    --c1: #9cc0f2; --c1-soft: #22344f; --c2: #c6b2f2; --c2-soft: #30284a; --c3: #8fd3cb; --c3-soft: #1b3734;
    --ring: #4a576a; --on-good: #2a0f18; --leaf1: #222c3b; --leaf2: #2a2331;
    --glass: rgba(92, 52, 66, .5); --glass-ink: #f2cbd7; --glass-line: rgba(255, 255, 255, .14); --glass-hi: rgba(255, 255, 255, .12); --glass-shadow: rgba(0, 0, 0, .35); --glass-btn: #c98aa0; --glass-btn-ink: #2a1119;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); --scrim: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121821; --card: #1b2330; --ink: #e6ecf5; --ink2: #9aa8bd; --line: #2b3646;
  --board: #2a4470; --board2: #1e3356; --chalk: #f2f6fc; --chalk2: #b9cbe6;
  --pink: #f08aa6; --on-pink: #2a0f18; --pink-soft: #3a2430; --pink-ink: #f4a3b9; --reg-ink: #f4a3b9;
  --yellow: #e5bb5c; --yellow-soft: #352d1c; --warn: #f19a6c; --on-warn: #2b130a; --warn-soft: #3b271e;
  --good: #f08aa6; --good-soft: #3a2430;
  --c1: #9cc0f2; --c1-soft: #22344f; --c2: #c6b2f2; --c2-soft: #30284a; --c3: #8fd3cb; --c3-soft: #1b3734;
  --ring: #4a576a; --on-good: #2a0f18; --leaf1: #222c3b; --leaf2: #2a2331;
  --glass: rgba(92, 52, 66, .5); --glass-ink: #f2cbd7; --glass-line: rgba(255, 255, 255, .14); --glass-hi: rgba(255, 255, 255, .12); --glass-shadow: rgba(0, 0, 0, .35); --glass-btn: #c98aa0; --glass-btn-ink: #2a1119;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); --scrim: rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--board); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 680px; margin-left: auto; margin-right: auto; }

/* ---------- 首页顶部 ---------- */
.top { background: var(--board); color: var(--chalk); padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 2px; }
.top .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .04em; line-height: 1.25; }
.top .sub { margin: 0; color: var(--chalk2); font-size: 12.5px; white-space: nowrap; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--board); padding-top: 8px; padding-bottom: 12px; border-radius: 0 0 22px 22px; box-shadow: 0 6px 16px rgba(40, 70, 120, .20); }
.bar-in { display: flex; gap: 8px; align-items: center; }
.search { flex: 1 1 auto; min-width: 0; height: 40px; border-radius: 999px; border: 1.5px solid transparent; background: var(--board2); color: var(--chalk); padding: 0 14px; font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; }
.search::placeholder { color: var(--chalk2); opacity: 1; }
.search:focus { outline: none; border-color: var(--chalk2); }
.seg { flex: none; display: flex; gap: 2px; background: var(--board2); border-radius: 999px; padding: 3px; }
.seg button { height: 34px; padding: 0 13px; border-radius: 999px; color: var(--chalk2); font-weight: 600; font-size: 14.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--board2); }

main { padding-top: 14px; padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }

/* ---------- 一排横着滑的短选项 ---------- */
.chips {
  display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 2px calc(28px + env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);
}
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink2); font-size: 14px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.count { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 5px; font-weight: 500; }
.chip-sub { font-weight: 500; opacity: .8; margin-left: 4px; }
.chip-note { flex: none; height: 34px; display: inline-flex; align-items: center; color: var(--ink2); font-size: 13.5px; }
/* 首页筛选：一排班级 + 全部，右边开关（开着看跟进中，关掉看已完成）；搜索时搜全部，这一排变淡 */
.frow { display: flex; align-items: center; gap: 10px; }
.frow .chips { flex: 1 1 auto; min-width: 0; margin-right: 0; padding-right: 4px; gap: 6px; -webkit-mask-image: none; mask-image: none; }
.frow .chips.fade { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent); }
.frow .chip { padding: 0 11px; }
.frow .count { margin-left: 4px; }
.sw { flex: none; position: relative; width: 50px; height: 30px; margin-top: -4px; border-radius: 999px; background: var(--ring); transition: background .2s ease; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s ease; }
.sw[aria-checked="true"] { background: var(--good); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.frow.searching .sw { opacity: .45; }

/* ---------- 卡片 ---------- */
.list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.card { position: relative; display: block; width: 100%; text-align: left; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 13px 16px 14px 18px; transition: transform .12s ease; }
.card:active { transform: scale(.985); }
.card::before, .who-box::before, .suggest::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: var(--lv, var(--line)); }
.lv1 { --lv: var(--line); }
.lv2 { --lv: var(--yellow); }
.lv3 { --lv: var(--warn); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
.card-date { font-weight: 700; color: var(--pink-ink); }
.card-name { display: flex; align-items: center; gap: 8px; margin-top: 1px; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
.card-name > span:last-child { min-width: 0; }
/* 右上角「这件事结束了」：像提醒事项那样点一下打勾；和卡片是兄弟元素，不嵌在卡片按钮里 */
.card-wrap { position: relative; }
.card-top, .card-name { padding-right: 34px; }
.check { position: absolute; top: 3px; right: 3px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.check i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ring); color: var(--on-good); display: flex; align-items: center; justify-content: center; transition: background .15s ease, border-color .15s ease; }
.check svg { width: 14px; height: 14px; opacity: 0; }
.check[aria-checked="true"] i { background: var(--good); border-color: var(--good); }
.check[aria-checked="true"] svg { opacity: 1; }
/* 已完成：一个学生一叠，最新的在最上面完整露出，旧的依次压在下面；点一叠整页切到这个人 */
.stacks { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
.stack { position: relative; display: block; width: 100%; text-align: left; padding-top: 30px; transition: transform .12s ease; }
.stack:active { transform: scale(.985); }
.tab { position: absolute; top: 0; left: 0; max-width: 100%; height: 38px; padding: 0 14px 8px; border-radius: 14px 14px 0 0; background: var(--card); display: flex; align-items: center; gap: 8px; }
.tab b { min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .n { flex: none; color: var(--ink2); font-size: 12.5px; font-weight: 600; }
.leaf { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px 12px 18px; }
.leaf.front { z-index: 3; box-shadow: var(--shadow); }
.leaf.under { margin-top: -16px; padding-top: 24px; padding-bottom: 9px; }
.leaf.u1 { z-index: 2; margin-left: 5px; margin-right: 5px; background: var(--leaf1); }
.leaf.u2 { z-index: 1; margin-left: 10px; margin-right: 10px; background: var(--leaf2); }
.leaf-row { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
.leaf-row .d { flex: none; font-weight: 700; color: var(--pink-ink); }
.leaf-row .ty { min-width: 0; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leaf-row .n { flex: none; }
.leaf-what { margin-top: 4px; font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.more { padding-top: 8px; text-align: center; color: var(--ink2); font-size: 12.5px; }
.p-sum { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 13.5px; }
/* 班级胶囊：设置里第 1/2/3 个班 蓝/紫/青，其他灰；只填数字的、数字加「班」的短班名和「其他」一样宽（min-width + 字居中），更长的班名照样撑开、不截断 */
.cls-pill { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 48px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; letter-spacing: 0; white-space: nowrap; background: var(--paper); color: var(--ink2); }
.cls-pill.c1 { background: var(--c1-soft); color: var(--c1); }
.cls-pill.c2 { background: var(--c2-soft); color: var(--c2); }
.cls-pill.c3 { background: var(--c3-soft); color: var(--c3); }
.card-what { margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-did { margin: 3px 0 0; color: var(--ink2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--paper); color: var(--ink2); white-space: nowrap; }
.tag.n2 { background: var(--yellow-soft); color: var(--yellow); }
.tag.n3 { background: var(--warn-soft); color: var(--warn); }

.who-box { position: relative; margin-top: 10px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 16px 12px 18px; }
.who-name { display: flex; align-items: center; gap: 8px; }
.who-name b { font-size: 18px; }
.who-line { color: var(--ink2); font-size: 13.5px; }
.who-next { margin-top: 4px; font-weight: 600; font-size: 14px; }

.empty { margin-top: 24px; text-align: center; color: var(--ink2); padding: 28px 18px; border: 1.5px dashed var(--line); border-radius: var(--r); }
.empty .big { font-family: var(--font-display); font-size: 22px; color: var(--ink); margin-bottom: 6px; }
.notice { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--yellow-soft); color: var(--yellow); font-size: 14px; font-weight: 600; }

/* 右下角圆形「+」：点开「+」转成「×」，上面一个接一个弹出各个班（带回弹）；点「×」或空白收回。名单页上它就是返回，也画成「×」
   遮罩、弹出的班、「+」都压在状态栏蓝带（body::before，z-index 30）上面：加到主屏幕时弹开，顶上那条也一起变暗 */
.fab { position: fixed; z-index: 33; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: var(--fab-h); height: var(--fab-h); border-radius: 50%; background: var(--pink); color: var(--on-pink); box-shadow: 0 8px 20px rgba(220, 93, 136, .32); display: inline-flex; align-items: center; justify-content: center; transition: transform .12s ease; }
.fab:active { transform: scale(.96); }
.fab i { flex: none; display: flex; width: 26px; height: 26px; transition: transform .34s cubic-bezier(.34, 1.56, .64, 1); }
.fab svg { width: 100%; height: 100%; }
.fab[aria-expanded="true"] i { transform: rotate(135deg); }
.dial-mask { position: fixed; inset: 0; z-index: 31; background: var(--scrim); cursor: pointer; touch-action: none; animation: fade-in .2s ease both; }
/* 弹出的班级按钮一样宽（都拉到最宽那个），圆点和班名靠左 */
.dial { position: fixed; z-index: 32; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(32px + var(--fab-h) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.dial-item { display: inline-flex; align-items: center; justify-content: flex-start; gap: 9px; height: 48px; padding: 0 22px 0 18px; border-radius: 999px; background: var(--card); color: var(--ink); font-size: 16px; font-weight: 700; box-shadow: var(--shadow); white-space: nowrap; transform-origin: 100% 50%; animation: dial-pop .4s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i, 0) * 55ms); }
.dial-item i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ink2); }
.dial-item.c1 i { background: var(--c1); }
.dial-item.c2 i { background: var(--c2); }
.dial-item.c3 i { background: var(--c3); }
.dial.out .dial-item { animation: dial-out .14s ease-in both; animation-delay: calc(var(--j, 0) * 25ms); }
.dial-mask.out { animation: fade-out .2s ease both; }
.dial-mask.out, .dial.out { pointer-events: none; }
@keyframes dial-pop { from { opacity: 0; transform: translateY(20px) scale(.55); } to { opacity: 1; transform: none; } }
@keyframes dial-out { to { opacity: 0; transform: translateY(12px) scale(.8); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }

/* ---------- 话术页 ---------- */
.sec { margin-top: 18px; }
.sec:first-child { margin-top: 4px; }
.sec h2 { margin: 0 0 8px; font-size: 17px; letter-spacing: .02em; }
.lead { margin: -2px 0 10px; color: var(--ink2); font-size: 14px; }
.box { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; }
.rules { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.say-row { display: grid; grid-template-columns: 6.8em minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }
.say-row:first-child { border-top: 0; padding-top: 0; }
.say-row:last-child { padding-bottom: 0; }
.say-row .when { color: var(--ink2); font-size: 13.5px; }
.say-row .words { font-weight: 600; }
.lvl { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.lvl:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.lvl-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; flex-wrap: wrap; }
.lvl ol, .suggest ol { margin: 6px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.quote { margin-top: 8px; background: var(--pink-soft); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 14.5px; }
.quote.msg { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper); border: 1px dashed var(--line); }
.quote.msg > div { min-width: 0; }
.quote-k { font-size: 12px; color: var(--ink2); font-weight: 600; }
.copy { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { flex: none; display: inline-flex; align-items: center; gap: 4px; background: var(--paper); border-radius: 999px; padding: 3px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; font-size: 18px; font-weight: 700; color: var(--ink); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper output { min-width: 2em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.fine { color: var(--ink2); font-size: 13px; margin-top: 10px; }
.set-part { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.cls-inputs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.cls-inputs .input { height: 40px; padding: 0 12px; }
.input:disabled { opacity: .55; }

<div id="app"></div>

<script>
(function () {
  'use strict';

  /* ---------- 话术：每种情况 × 第几次（say = 当面说，msg = 发给班主任） ---------- */
  var TYPES = [
    { key: 'class', name: '上课说话、小动作', lv: {

      3: { title: '交给班主任一起管', steps: ['课上还是照第一次那样处理，不当场吵。', '下课把名字和次数发给班主任。', '发出去，这件事在我这儿就结束了。'], msg: '{名}这段时间上课第 {N} 次说话了，麻烦你一起管一下。' }
    } },
    { key: 'homework', name: '作业没交、没订正', lv: {
      1: { title: '记名字，定补交时间', steps: ['记下名字。', '告诉他什么时候前补上。'], say: '{名}，明天早上上课前补交给我。' },
      2: { title: '补交单独一摞，上课先点他', steps: ['早上补交的单独放一摞。', '上课提问，先点这些人。'], say: '{名}，第 {N} 次了。明早补交，上课我先提问你。' },
      3: { title: '交给班主任', steps: ['把名字和次数发给班主任。', '发出去，这件事在我这儿就结束了。'], msg: '{名}作业已经第 {N} 次没交了，麻烦你跟他说一下。' }
    } },
    { key: 'nocome', name: '叫了不来', lv: {
      1: { title: '不隔空叫，直接去带', steps: ['下课直接走到他座位边。', '说一句，带着他一起走。'], say: '{名}，走，跟我去一趟。' },
      2: { title: '不追了，就在座位边说完', steps: ['不再叫他去办公室，也不等他来。', '下次见到他，在座位边一分钟说完要求。', '说完就走，不等他回应。'], say: '{名}，我就在这儿说一句：____。说完了。' },
      3: { title: '交给班主任', steps: ['不再自己叫。', '把名字和事情发给班主任，到这儿结束。'], msg: '{名}叫了几次都不来，麻烦你处理一下。' }
    } },
    { key: 'talkback', name: '顶嘴、找理由', lv: {
      1: { title: '只说一句，翻来覆去说', steps: ['他说什么都不接，只重复这一句。', '说了三遍还不动：「这事下课再说。」接着上课。', '不问「为什么」，不等他道歉。'], say: '我听到了。你要做的是 ____。' },
      2: { title: '下课单独说，五分钟收', steps: ['只说要求和结果，不辩论。', '五分钟内结束：「行，就到这儿。」'], say: '我不跟你争。你要做的是 ____。' },

    { key: 'other', name: '其他', lv: {
      1: { title: '先记下来，下课再说', steps: ['当场不处理，先记下来。', '下课只说要求，不讲道理。'], say: '这事下课再说。' },
      2: { title: '下课单独说一次', steps: ['只说要求和结果，一分钟。'], say: '{名}，你要做的是 ____。' },
      3: { title: '交给班主任', steps: ['把事情和次数发给班主任，到这儿结束。'], msg: '{名}这是第 {N} 次了：____，麻烦你处理一下。' }

  ];
  var SAYINGS = [
    ['打断他', '先停一下。'],
    ['说要求', '你现在要做的是 ____。'],
    ['他顶嘴、找理由', '我听到了。你要做的是 ____。'],
    ['三遍还不动', '这事下课再说。'],

    ['自己急了', '这事下课再说。']

  /* ---------- 状态 ---------- */
  var S = {
    db: null, dbState: 'loading', items: [], escalateAt: 3, classes: ['', '', ''], settingsAt: 0,
    view: 'home', tab: 'records', filter: 'all', showDone: false, q: '', scroll: { records: 0, scripts: 0 },
    person: null, personScroll: 0, form: null, formInit: '', saving: false, backArmed: false, delArmed: false,

  var app = document.getElementById('app');
  var refs = {};

  function h(tag, attrs, kids) {

    if (attrs) Object.keys(attrs).forEach(function (k) {

  /* ---------- 小工具 ---------- */

  function typeOf(key) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i].key === key) return TYPES[i]; return TYPES[TYPES.length - 1]; }
  function pad2(n) { return String(n).padStart(2, '0'); }

  }
  function nth(it) { return countBefore(it.student, itemKey(it), it.id); }

  function fill(s, name, n) { return s.replace(/\{名\}/g, name || 'XX').replace(/\{N\}/g, String(n)); }
  function lvLabel(l) {
    var E = S.escalateAt;
    if (l === 1) return '第 1 次';

    S.classes.forEach(function (c) { c = norm(c); if (c && c !== '其他' && set.indexOf(c) < 0) set.push(c); });
    S.items.forEach(function (it) { if (it.cls && it.cls !== '其他' && set.indexOf(it.cls) < 0) set.push(it.cls); });
    return set;
  }
  function students() {
    var map = {};
    S.items.forEach(function (it) {
      var nm = norm(it.student); if (!nm) return;
      var k = itemKey(it), m = map[nm] || (map[nm] = { name: nm, cls: '', count: 0, last: '', lastDate: '' });

  function keepScrollLeft(row, build) { var sl = row.scrollLeft; row.textContent = ''; build(); row.scrollLeft = sl; }

  /* ---------- 首页：顶部只建一次，打字时不重建搜索框 ---------- */

  /* ---------- 「+」：点开弹出设置里填了名字的班；有名单进名单页，没名单直接记一笔；一个班都没填就直接记一笔 ---------- */
  var PLUS_SVG = '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M13 5v16M5 13h16"/></svg>';

  }

  function myClasses() {

    S.classes.forEach(function (c, i) { c = norm(c); if (c && c !== '其他' && !out.some(function (o) { return o.name === c; })) out.push({ name: c, i: i }); });

  }

  /* 设置连着改只存最后一下，同一时间只写一次；每次把所有设置一起存。离开输入框、切走页面马上存 */
  var setTimer = null, setWriting = false, setPending = false;

  /* ---------- 备份：导出一个 JSON（iPhone 走分享面板，能「存储到文件」；别处直接下载）；

  function exportBackup() {
    var rosters = {}, nr = 0;
    S.rosters.forEach(function (r, i) { if (r) { rosters['roster' + (i + 1)] = r; nr++; } });

    var file = new File([JSON.stringify(data, null, 1)], '小本本备份-' + today() + '.json', { type: 'application/json' });
    var done = '导出了 ' + S.items.length + ' 条' + (nr ? '和 ' + nr + ' 份名单' : '');
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(function () { toast(done); }, function (e) { if (!e || e.name !== 'AbortError') download(file); });
      return;
    }
    download(file); toast(done);
  }
  function download(file) {
    var url = URL.createObjectURL(file), a = h('a', { href: url, download: file.name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }
  function str(v) { return v == null ? '' : String(v); }
  function cleanItem(x) {
    return { student: norm(x.student), cls: str(x.cls), type: str(x.type), date: /^\d{4}-\d\d-\d\d$/.test(x.date) ? x.date : '',

      var have = Object.create(null), r = { added: 0, updated: 0, same: 0 }, b = S.db.batch();
      S.items.forEach(function (it) { have[it.id] = it; });

      });

          classes: [0, 1, 2].map(function (i) { return Array.isArray(st.classes) ? norm(st.classes[i]) : ''; }) });
      }
      /* 名单：设置也一起导进来就按第几个班放；设置没导（本机的新）就按班名找本机同名的班，找不到的不导、提示一句。
         每个班 updatedAt 新的那份赢；老备份没有 rosters 就跳过 */
      var ro = o.rosters && typeof o.rosters === 'object' ? o.rosters : {}, rn = 0, miss = 0, used = [];

        if (r.same) parts.push(r.same + ' 条本来就有');

    }).catch(function (e) { toast(errText(e)); });
  }

  /* ---------- 名单：设置里第几个班就存 settings/rosterN（N = 1/2/3，改班名不丢名单）；
     每份 = { names: [按学号顺序], regulars: [常客名字], updatedAt }。记录照旧按名字数，名单不动记录 ---------- */
  var HEAD_WORDS = ['姓名', '名字', '学生', '学生姓名', '学号', '序号', '编号', '名单'];
  /* 名字整理：去掉看不见的字符，多个空格（全角空格也算，norm 里的 \s 管）合成一个；每段都是单个汉字的去掉中间空格（Excel 里两个字的名字常在中间塞个全角空格对齐） */
  function cleanName(s) {
    var t = norm(String(s == null ? '' : s).replace(/[\u200b-\u200d\u2060\ufeff]/g, ''));
    return /^[㐀-鿿](?: [㐀-鿿])+$/.test(t) ? t.replace(/ /g, '') : t;
  }
  /* 不是名字的词：纯数字（学号）、班级（「3班」「高一(3)班」「七年级」：带数字、以「班 / 级」结尾）、性别 */
  var NOT_NAME = /^\d+$|^\S*[\d一二三四五六七八九十]\S*[班级]$|^[男女]$/;
  /* 一格里用空格隔开好几样（从微信、PDF 复制的「名字 男」「3班 名字」）：有汉字时按空格切，取第一个是名字的词 */
  function firstWord(t) {
    var w = (/[㐀-鿿]/.test(t) ? t.split(' ') : [t]).filter(function (x) { return x && !NOT_NAME.test(x); });
    return w.length ? w[0] : '';
  }
  /* 一格 → 名字：先把班级、学号、性别那几样拿掉（「3班」的 3 别当学号去掉），再去掉开头的学号（「01 名字」「1.名字」） */
  function cellName(c) {
    var t = cleanName(c).split(' ').filter(function (x) { return !NOT_NAME.test(x); }).join(' ');
    return firstWord(cleanName(t.replace(/^\s*(?:[(（[【]?\d+\s*[.、．,，:：)）\]】-]?|[①-⑳])\s*/, '')));
  }
  /* 粘进来的名单 → 名字：一行一个，顺序就是学号；全角数字先换成半角；
     两列以上（Tab 隔开）一行一个人，取第一个是名字的格子；没有 Tab 的行里用「、，,」隔开的，一段一个人；
     空行、表头跳过；重复的只留第一次 */
  function parseRoster(text) {
    var names = [], dup = 0;
    function add(nm) {
      if (!nm || HEAD_WORDS.indexOf(nm) >= 0 || /姓名|学号/.test(nm)) return;

      names.push(nm);

      var cells = line.split('\t'), nm = '';
      if (cells.length > 1) { for (var i = 0; i < cells.length && !nm; i++) nm = cellName(cells[i]); add(nm); return; }

    });
    return { names: names, dup: dup };
  }
  function cleanRoster(x) {
    if (!x || !Array.isArray(x.names)) return null;
    var names = [], regs = [];
    x.names.forEach(function (n) { n = cleanName(n); if (n && names.indexOf(n) < 0) names.push(n); });
    (Array.isArray(x.regulars) ? x.regulars : []).forEach(function (n) { n = cleanName(n); if (names.indexOf(n) >= 0 && regs.indexOf(n) < 0) regs.push(n); });
    return { names: names, regulars: regs, updatedAt: +x.updatedAt || 0 };
  }
  function hasRoster(i) { return !!(S.rosters[i] && S.rosters[i].names.length); }
  /* 先改本地再写；updatedAt 一次比一次大，晚到的旧快照不会盖掉刚点的 */
  function writeRoster(i, names, regulars) {
    var old = S.rosters[i], d = { names: names, regulars: regulars, updatedAt: Math.max(Date.now(), (old ? old.updatedAt : 0) + 1) };
    S.rosters[i] = d;
    return S.db.doc('settings/roster' + (i + 1)).set(d).catch(function (e) {
      if (S.rosters[i] === d) S.rosters[i] = old;

  /* 名单变了：名单页、设置里的名单页、设置（没在打字时）跟着变 */
  function onRoster() {

  }
  /* 一格一个名字：四个字、五个字的字小一号，六个字以上折成两行；reg = 常客；n = 记过几次（0 不显示）；pressable = 设置里点一下切换常客 */
  function nameCell(nm, reg, n, onclick, pressable) {

      h('button', { class: 'back', type: 'button', onclick: backRosterEdit, text: '‹ 返回' }), h('h1', { text: (norm(S.classes[e.i]) || '班级 ' + (e.i + 1)) + '名单' }), h('span')
    ])]));

    ]));
    m.appendChild(h('div', { class: 'fine', text: '一行一个名字，顺序就是学号；前面带学号也行，重复的会去掉。换名单不动已经记过的事，还在新名单里的人常客标记留着。' }));

  }
  function renderRosterEdit() {
    var e = S.rosterEdit, r = S.rosters[e.i], box = refs.regs;

  }
  function renderPasteNote() {
    var e = S.rosterEdit; if (!e || !refs.pnote) return;

      : '认出 ' + n + ' 人：' + p.names.slice(0, 3).join('、') + (n > 4 ? ' … ' + p.names[n - 1] : n === 4 ? '、' + p.names[3] : '') + (p.dup ? '（去掉 ' + p.dup + ' 个重复）' : '');

  /* ---------- 记一笔（整页） ---------- */
  function blankForm() { return { id: null, student: '', cls: '', type: '', date: today(), what: '', did: '', result: '', done: false, createdAt: 0, autoDid: '' }; }

    refs.suggest = h('div');
    m.appendChild(refs.suggest);

    function ta(id, label, key, ph, hint) {
      var el = h('textarea', { class: 'ta', id: id, placeholder: ph, rows: '2' });
      el.value = f[key];
      el.addEventListener('input', function () { f[key] = el.value; grow(el); });
      return { el: el, field: h('div', { class: 'field' }, [h('label', { for: id }, [label, hint ? h('span', { class: 'hint', text: hint }) : null]), el]) };
    }
    var what = ta('f-what', '发生了什么', 'what', '一两句就行，比如：上课一直跟同桌说话');
    var did = ta('f-did', '我怎么处理的', 'did', '选好情况会自动套上话术，改成你实际说的', '自动套了话术，可以改');
    var res = ta('f-result', '结果 / 后续', 'result', '比如：交给班主任了，到这儿结束');
    refs.did = did.el;
    m.appendChild(what.field); m.appendChild(did.field); m.appendChild(res.field);

    var date = h('input', { class: 'input', id: 'f-date', type: 'date' });
    date.value = f.date;
    date.addEventListener('change', function () { f.date = date.value || today(); renderSuggest(); autoFillDid(); });
    m.appendChild(h('div', { class: 'field' }, [h('label', { for: 'f-date', text: '日期' }), date]));

    var done = h('input', { type: 'checkbox', id: 'f-done', role: 'switch' });
    done.checked = f.done;
    done.addEventListener('change', function () { f.done = done.checked; });
    m.appendChild(h('div', { class: 'field' }, [h('label', { class: 'switch', for: 'f-done' }, [
      h('span', null, [h('b', { text: '这件事结束了' }), h('div', { class: 'fine', text: '交出去了、或者不用再管，就打开' })]), done
    ])]));

    if (f.id) {
      var del = h('button', { class: 'danger', type: 'button', text: '删掉这一笔' });
      del.addEventListener('click', function () { removeItem(del); });
      m.appendChild(del);
    }

    renderStudents(); renderClasses(); renderTypes(); renderSuggest();
    [what.el, did.el, res.el].forEach(grow);
    [refs.cls, refs.type].forEach(function (row) {
      var on = row.querySelector('[aria-pressed="true"]');
      if (on && on.offsetLeft + on.offsetWidth > row.clientWidth - 24) row.scrollLeft = on.offsetLeft - 16;
    });
  }

  function renderStudents() {
    var row = refs.students; if (!row) return;
    var all = students();
    if (!all.length) { row.hidden = true; return; }
    row.hidden = false;
    var f = S.form, q = norm(f.student).toLowerCase();
    var list = (q ? all.filter(function (s) { return s.name.toLowerCase().indexOf(q) >= 0; }) : all).slice(0, 20);
    keepScrollLeft(row, function () {
      if (!list.length) { row.appendChild(h('span', { class: 'chip-note', text: '新同学，第一次记' })); return; }
      list.forEach(function (s) {
        row.appendChild(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(norm(f.student) === s.name), onclick: function () { pickStudent(s); } }, [
          s.name, s.cls ? h('span', { class: 'chip-sub', text: '· ' + s.cls }) : null, h('span', { class: 'count', text: s.count + '次' })
        ]));
      });
    });
  }
  function pickStudent(s) {
    var f = S.form;
    f.student = s.name; refs.student.value = s.name;
    if (s.cls) f.cls = s.cls;
    renderStudents(); renderClasses(); renderSuggest(); autoFillDid();
  }
  function renderClasses() {
    var row = refs.cls, f = S.form;
    keepScrollLeft(row, function () {
      classes().concat(['其他']).forEach(function (c) {
        row.appendChild(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(f.cls === c), onclick: function () { f.cls = f.cls === c ? '' : c; renderClasses(); } }, [c]));
      });
      if (!S.classes.some(norm)) row.appendChild(h('span', { class: 'chip-note', text: '你的班在「话术」页最下面的设置里填' }));
    });
  }
  function renderTypes() {
    var row = refs.type, f = S.form;
    keepScrollLeft(row, function () {
      TYPES.forEach(function (t) {
        row.appendChild(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(f.type === t.key), onclick: function () { f.type = t.key; renderTypes(); renderSuggest(); autoFillDid(); } }, [t.name]));
      });
    });
  }
  function renderSuggest() {
    var slot = refs.suggest, f = S.form; if (!slot) return;
    slot.textContent = '';
    if (!f.type) { slot.appendChild(h('div', { class: 'suggest-empty', text: '选好「哪种情况」，这里会出来这一次该怎么做、照着说哪句。' })); return; }
    var name = norm(f.student), n = currentN(f), lv = level(n), x = typeOf(f.type).lv[lv];
    var who = name ? name + '的第 ' + n + ' 次' + (lv === 3 ? '，该交给班主任了' : '') : '写上名字，就知道是他第几次了';
    slot.appendChild(h('div', { class: 'suggest lv' + lv }, [
      h('div', { class: 'who', text: who }),
      h('div', { class: 'what', text: x.title }),
      h('ol', null, x.steps.map(function (s) { return h('li', { text: s }); })),
      x.say ? sayBubble(fill(x.say, name, n)) : null,
      x.msg ? msgBubble(fill(x.msg, name, n)) : null
    ]));
  }

  function save() {
    var f = S.form;
    if (!f || S.saving) return;
    if (!norm(f.student)) { toast('先写名字'); refs.student.focus(); return; }
    if (!f.type) { toast('选一下是哪种情况'); return; }
    if (!S.db) { toast('这个浏览器存不了记录'); return; }
    var body = { student: norm(f.student), cls: f.cls, type: f.type, date: f.date || today(), what: f.what.trim(), did: f.did.trim(), result: f.result.trim(), done: !!f.done, updatedAt: Date.now() };
    var isNew = !f.id, p;
    if (isNew) {
      var ref = S.db.collection('incidents').doc();
      body.createdAt = Date.now();
      p = ref.set(body);
    } else {
      p = S.db.doc('incidents/' + f.id).update(body);
    }
    S.saving = true; refs.save.disabled = true; refs.save.textContent = '存着…';
    p.then(function () {
      S.saving = false;
      if (S.form !== f) return;
      closeForm(isNew); toast(isNew ? '记好了' : '改好了');
    }, function (e) {
      S.saving = false;
      if (S.form === f && refs.save) { refs.save.disabled = false; refs.save.textContent = '存'; }
      toast(errText(e));
    });
  }

  /* 返回也会存；名字或情况没填、存不了的时候，再点一次才算不要 */
  function back() {
    var f = S.form;
    if (!f || formSig(f) === S.formInit) { closeForm(false); return; }
    if (norm(f.student) && f.type) { save(); return; }
    if (S.backArmed) { closeForm(false); return; }
    S.backArmed = true;
    toast((!norm(f.student) ? '还没写名字' : '还没选是哪种情况') + '，存不了。再点一次「返回」就不要这一笔了');
    setTimeout(function () { S.backArmed = false; }, 4000);
  }

  function removeItem(btn) {
    var f = S.form;
    if (!S.delArmed) {
      S.delArmed = true; btn.className = 'danger armed'; btn.textContent = '再点一次，真的删掉';
      setTimeout(function () { if (S.form === f && S.delArmed) { S.delArmed = false; btn.className = 'danger'; btn.textContent = '删掉这一笔'; } }, 4000);
      return;
    }
    if (!S.db) return;
    btn.disabled = true;
    S.db.doc('incidents/' + f.id).delete().then(function () {
      if (S.form !== f) return;
      closeForm(false); toast('删掉了');
    }, function (e) { btn.disabled = false; toast(errText(e)); });
  }

  /* 数据来了：首页重画卡片，记一笔页只更新「第几次」和学生那一排，不动输入框 */
  function onData() {
    if (S.view === 'home') { syncHeader(); renderMain(); }
    else if (S.view === 'person') renderPerson();
    else if (S.view === 'roster') renderRoster();
    else if (S.view === 'form' && S.form) { renderStudents(); renderSuggest(); }
  }

  /* ---------- 本地存储：IndexedDB 库 class-log，一个集合一个 object store，key 是文档 id。
     接口照 claude.ai 的 db 写（collection/doc/set/update/delete/onSnapshot）；
     写完先把新数据推给所有 onSnapshot 再算存好，别的标签页用 BroadcastChannel 通知。 ---------- */
  function openLocalDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open('class-log', 1);
      req.onupgradeneeded = function () {
        ['incidents', 'settings'].forEach(function (n) { if (!req.result.objectStoreNames.contains(n)) req.result.createObjectStore(n); });
      };
      req.onsuccess = function () { resolve(localDb(req.result)); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function localDb(idb) {
    var subs = [], chan = null;
    idb.onversionchange = function () { idb.close(); };
    try { chan = new BroadcastChannel('class-log'); chan.onmessage = function (e) { notify(e.data); }; } catch (e) {}

    function tx(cols, mode, work) {
      return new Promise(function (resolve, reject) {
        var t = idb.transaction(cols, mode);
        work(t);
        t.oncomplete = function () { resolve(); };
        t.onabort = t.onerror = function () { reject(t.error); };
      });
    }
    function read(col, id) {
      var docs = [], one;
      return tx(col, 'readonly', function (t) {
        var st = t.objectStore(col);
        if (id) { var g = st.get(id); g.onsuccess = function () { one = g.result; }; return; }
        st.openCursor().onsuccess = function (e) {
          var c = e.target.result; if (!c) return;
          docs.push({ id: c.key, v: c.value }); c.continue();
        };
      }).then(function () {
        if (id) return { id: id, exists: one !== undefined, data: function () { return one; } };
        return { docs: docs.map(function (d) { return { id: d.id, data: function () { return d.v; } }; }) };
      });
    }
    /* 同一个监听连着读好几次时，只送最后一次的结果 */
    function deliver(s) {
      var n = ++s.seq;
      return read(s.col, s.id).then(function (snap) { if (!s.off && n === s.seq) s.fn(snap); }, function (e) { if (!s.off && s.err) s.err(e); });
    }
    function notify(col) { return Promise.all(subs.filter(function (s) { return s.col === col; }).map(deliver)); }
    function changed(cols) {
      return Promise.all(cols.map(function (col) { if (chan) chan.postMessage(col); return notify(col); }));
    }
    function write(col, work) {
      return tx(col, 'readwrite', function (t) { work(t.objectStore(col)); }).then(function () { return changed([col]); });
    }
    function listen(col, id, fn, err) {
      var s = { col: col, id: id, fn: fn, err: err, seq: 0 };
      subs.push(s); deliver(s);
      return function () { s.off = true; subs.splice(subs.indexOf(s), 1); };
    }
    function newId() {
      var a = new Uint8Array(10); crypto.getRandomValues(a);
      return Array.prototype.map.call(a, function (b) { return (b + 256).toString(16).slice(1); }).join('');
    }
    function ref(col, id) {
      return {
        id: id, path: col + '/' + id,
        set: function (data) { return write(col, function (st) { st.put(data, id); }); },
        /* 合并进已有的；这一笔已经被别的标签页删了，就按这次的内容重新存 */
        update: function (data) {
          return write(col, function (st) {
            var g = st.get(id);
            g.onsuccess = function () { st.put(Object.assign({}, g.result, data), id); };
          });
        },
        delete: function () { return write(col, function (st) { st.delete(id); }); },
        onSnapshot: function (fn, err) { return listen(col, id, fn, err); }
      };
    }
    return {
      collection: function (col) {
        return { doc: function (id) { return ref(col, id || newId()); }, onSnapshot: function (fn, err) { return listen(col, null, fn, err); } };
      },
      doc: function (path) { var i = path.indexOf('/'); return ref(path.slice(0, i), path.slice(i + 1)); },
      /* 好几条一次写完（导入用），写完每个集合只通知一次 */
      batch: function () {
        var ops = [];
        return {
          set: function (r, data) { var i = r.path.indexOf('/'); ops.push([r.path.slice(0, i), r.id, data]); },
          commit: function () {
            var cols = [];
            ops.forEach(function (o) { if (cols.indexOf(o[0]) < 0) cols.push(o[0]); });
            if (!cols.length) return Promise.resolve();
            return tx(cols, 'readwrite', function (t) { ops.forEach(function (o) { t.objectStore(o[0]).put(o[2], o[1]); }); })
              .then(function () { return changed(cols); });
          }
        };
      }
    };
  }

  /* ---------- 接上数据库 ---------- */
  mountHome();
  try {
    navigator.storage.persisted().then(function (yes) { return yes || navigator.storage.persist(); }).catch(function () {});
  } catch (e) {}
  (async function () {
    var db = null;
    try { db = await openLocalDb(); } catch (e) { db = null; }
    if (!db) { S.dbState = 'none'; onData(); return; }
    S.db = db;
    db.collection('incidents').onSnapshot(function (snap) {
      S.items = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data() || {}); });
      S.dbState = 'ready'; onData();
    }, function () {
      S.dbState = 'ready'; toast('读记录出错了，刷新一下试试');
      onData();
    });
    db.doc('settings/main').onSnapshot(function (snap) {
      if (settingsBusy()) return;
      var d = snap.exists ? snap.data() : null, v = d ? +d.escalateAt : 3;
      S.settingsAt = d && +d.updatedAt || 0;
      var next = v >= 2 && v <= 6 ? v : 3;
      var cls = [0, 1, 2].map(function (i) { return d && Array.isArray(d.classes) && d.classes[i] ? String(d.classes[i]) : ''; });
      if (next !== S.escalateAt || cls.join('\n') !== S.classes.join('\n')) { S.escalateAt = next; S.classes = cls; onData(); }
    }, function () {});
    [0, 1, 2].forEach(function (i) {
      db.doc('settings/roster' + (i + 1)).onSnapshot(function (snap) {
        var d = snap.exists ? cleanRoster(snap.data()) : null, mine = S.rosters[i];
        if (d && mine && d.updatedAt < mine.updatedAt) return;
        if (JSON.stringify(d) === JSON.stringify(mine)) return;
        S.rosters[i] = d; onRoster();
      }, function () {});
    });
  })();
})();
</script>
</body>
